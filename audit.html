<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Audit Log</title>
    <style>
        body { margin: 0; background: #f4f7fb; color: #172033; font-family: Arial, sans-serif; }
        .page { max-width: 1100px; margin: auto; padding: 24px; }
        .panel { background: white; border: 1px solid #d9e2ec; border-radius: 8px; padding: 20px; }
        nav { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        a { color: #1769aa; font-weight: 700; text-decoration: none; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; min-width: 700px; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #d9e2ec; text-align: left; }
        th { background: #edf5fc; }
        .error { color: #b42318; }
    </style>
</head>
<body>
    <main class="page">
        <section class="panel">
            <nav><a href="/dashboard">Dashboard</a><a href="/purchase">Purchase</a><a href="/production">Production</a><a href="/sales">Sales</a></nav>
            <h1>Audit Log</h1>
            <p id="message">Loading recent actions...</p>
            <div class="table-wrap"><table><thead><tr><th>User</th><th>Action</th><th>Entity</th><th>Entity ID</th><th>Details</th><th>Time</th></tr></thead><tbody id="rows"></tbody></table></div>
        </section>
    </main>
    <script>
        async function loadAuditLog() {
            const response = await fetch('/api/audit-logs');
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || 'Audit log request failed.');
            document.getElementById('rows').innerHTML = result.logs.map((log) => `<tr><td>${log.username}</td><td>${log.action}</td><td>${log.entity_type}</td><td>${log.entity_id}</td><td>${log.details || ''}</td><td>${log.created_at}</td></tr>`).join('');
            document.getElementById('message').textContent = `${result.logs.length} recent action(s)`;
        }
        loadAuditLog().catch((error) => { document.getElementById('message').className = 'error'; document.getElementById('message').textContent = error.message; });
    </script>
</body>
</html>
