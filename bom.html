<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP BOM Management</title>
    <style>
        body { margin: 0; background: #f4f7fb; color: #172033; font-family: Arial, sans-serif; }
        .page { max-width: 900px; margin: auto; padding: 24px; }
        .panel { background: #fff; border: 1px solid #d9e2ec; border-radius: 8px; padding: 20px; margin-bottom: 18px; }
        nav { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; } a { color: #1769aa; font-weight: 700; text-decoration: none; }
        label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; } select, input { padding: 10px; border: 1px solid #d9e2ec; border-radius: 5px; font: inherit; }
        .line { display: grid; grid-template-columns: 1fr 180px auto; gap: 12px; align-items: end; margin: 12px 0; }
        button { border: 0; border-radius: 5px; padding: 10px 14px; color: white; background: #1769aa; cursor: pointer; font-weight: 700; } .remove { background: #b42318; }
        .message { min-height: 20px; color: #b42318; } @media (max-width: 650px) { .line { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <main class="page"><section class="panel"><nav><a href="/dashboard">Dashboard</a><a href="/production">Production</a><a href="/inventory">Inventory</a></nav><h1>Bill of Materials</h1><form id="bomForm"><label>Product<select id="productId" required></select></label><div id="items"></div><button type="button" id="addItem">Add Material</button><p class="message" id="message"></p><button type="submit">Save BOM</button></form></section></main>
    <script>
        let materials = [];
        async function requestJson(url, options = {}) { const response = await fetch(url, options); const result = await response.json(); if (!response.ok) throw new Error(result.error || 'BOM request failed.'); return result; }
        function addItem() { const row = document.createElement('div'); row.className = 'line'; row.innerHTML = `<label>Material<select class="material">${materials.map((item) => `<option value="${item.id}">${item.name} (${item.unit})</option>`).join('')}</select></label><label>Quantity per unit<input class="amount" type="number" min="0.001" step="0.001" required></label><button class="remove" type="button">Remove</button>`; row.querySelector('.remove').addEventListener('click', () => row.remove()); document.getElementById('items').appendChild(row); }
        async function load() { const [products, materialResult] = await Promise.all([requestJson('/api/products'), requestJson('/api/materials')]); materials = materialResult.materials; document.getElementById('productId').innerHTML = products.products.map((item) => `<option value="${item.id}">${item.name} (${item.code})</option>`).join(''); addItem(); }
        document.getElementById('addItem').addEventListener('click', addItem);
        document.getElementById('bomForm').addEventListener('submit', async (event) => { event.preventDefault(); const items = [...document.querySelectorAll('.line')].map((row) => ({ material_id: row.querySelector('.material').value, quantity_per_unit: Number(row.querySelector('.amount').value) })); try { await requestJson('/api/boms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ product_id: document.getElementById('productId').value, items }) }); document.getElementById('message').textContent = 'BOM saved successfully.'; } catch (error) { document.getElementById('message').textContent = error.message; } });
        load().catch((error) => { document.getElementById('message').textContent = error.message; });
    </script>
</body>
</html>
