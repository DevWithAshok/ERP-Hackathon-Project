<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<style>
    .login-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: linear-gradient(125deg, #6ea4f6, #45dff0);
       
    }
    .login-container h2 {
        margin-bottom: 20px;
    }
    .login-container form {
        display: flex;
        flex-direction: column;
        align-items: start;
    }
    .login-container label {
        margin-bottom: 5px;
    }
    .login-container input {
        margin-bottom: 15px;
        padding: 8px;
        width: 200px;
    }
    .back-button {
        padding: 10px 20px;
        background-color: #8a1212;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    
    .login-button {
        padding: 10px 20px;
        background-color: #0c8910;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        display: flex;
        justify-content: start;
        align-items: start;
    }
    .login-button-container {
        display: flex;
        justify-content: start;
        align-items: start;
    }
    .label {
        font-weight: bold;
    }

    .login-heading {
        color: #0c119a;
        font-size: 24px;
        margin-bottom: 20px;
        font-weight: bold;
    }

    .login-input {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .login-label {
        text-align: left;
        font-weight: bold;
        margin-bottom: 5px;
    }
    .back-button {
        padding: 10px 20px;
        background-color: #f44336;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        justify-content: end;
        align-items: end;
    }
    .login-form-container {
        background-color: #f9f9f9;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .back-button-container {
        display: flex;
        justify-content: end;
        align-items: end;
    }
    .button-container {
        display: flex;
        justify-content: space-between;
        width: 100%;
    }
    .login-error {
        min-height: 20px;
        color: #b42318;
        font-size: 14px;
        margin: 0 0 12px;
    }
</style>
<body>
    <div class="login-container">
        <div class="login-form-container">
            <h2 class="login-heading">Login</h2>
            <form class="login-form" id="loginForm" novalidate>
                <label class="login-label" for="username">Username:</label>
                <input class="login-input" type="text" placeholder="Enter your username" id="username" name="username" required>
                <br><br>
                <label class="login-label" for="password">Password:</label>
                <input class="login-input" type="password" placeholder="Enter your password" id="password" name="password" required>
                <br><br>
                <label class="login-label" for="role">Login as:</label>
                <select class="login-input" id="role" name="role" required>
                    <option value="">Select a role</option>
                    <option value="Administrator">Administrator</option>
                    <option value="Manager">Manager</option>
                    <option value="Employee">Employee</option>
                </select>
                <p class="login-error" id="loginError" role="alert"></p>
                <div class="button-container">
                    <div class="login-button-container">
                        <button class="login-button" type="submit">Login</button>
                    </div>
                    <div class="back-button-container">
                        <button class="back-button" type="button" onclick="window.location.href='/'">Back</button>
                    </div>
                </div>
                
            </form>
        </div>
    </div>
</body>
<script>
                const selectedRole = new URLSearchParams(window.location.search).get('role');
                const roleSelect = document.getElementById('role');
                if (['Administrator', 'Manager', 'Employee'].includes(selectedRole)) {
                    // The landing-page button preselects the role, while the user still enters credentials.
                    roleSelect.value = selectedRole;
                }

                const loginForm = document.getElementById('loginForm');
                const loginError = document.getElementById('loginError');

                loginForm.addEventListener('submit', function (event) {
                    // Stop the browser from reloading while the Flask login request runs.
                    event.preventDefault();

                    const username = document.getElementById('username').value.trim();
                    const password = document.getElementById('password').value.trim();
                    const role = document.getElementById('role').value;

                    if (!username || !password || !role) {
                        loginError.textContent = 'Enter a username, password, and role.';
                        return;
                    }

                    fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, role })
                    })
                        .then(async (response) => {
                            const result = await response.json();
                            if (!response.ok) throw new Error(result.error || 'Login failed.');
                            return result;
                        })
                        .then(() => {
                            window.location.href = '/dashboard';
                        })
                        .catch((error) => {
                            loginError.textContent = error.message;
                        });
                });
</script>
</html>
