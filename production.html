<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Production</title>
    <style>
        :root { --ink: #172033; --muted: #667085; --line: #d9e2ec; --brand: #1769aa; --danger: #b42318; --success: #067647; --page: #f4f7fb; }
        * { box-sizing: border-box; }
        body { margin: 0; color: var(--ink); background: var(--page); font-family: Arial, sans-serif; }
        .page { max-width: 1150px; margin: auto; padding: 24px; }
        .panel { background: white; border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .topbar, .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
        h1, h2 { margin-top: 0; }
        .nav-links { display: flex; flex-wrap: wrap; gap: 12px; }
        a { color: var(--brand); font-weight: 700; text-decoration: none; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 5px; font: inherit; }
        button { border: 0; border-radius: 5px; padding: 10px 14px; color: white; background: var(--brand); cursor: pointer; font-weight: 700; }
        .message { min-height: 20px; color: var(--danger); }
        .requirements { min-height: 22px; color: var(--success); font-weight: 700; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 760px; }
        th, td { padding: 12px; border-bottom: 1px solid var(--line); text-align: left; }
        th { background: #edf5fc; }
        .status { font-weight: 700; }
        .status.pending { color: #9a6700; }
        .status.in-progress { color: var(--brand); }
        .status.completed { color: var(--success); }
        .empty { color: var(--muted); text-align: center; }
        @media (max-width: 720px) { .topbar, .toolbar { align-items: stretch; flex-direction: column; } .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <main class="page">
        <section class="panel topbar">
            <h1>BOM and Production</h1>
            <nav class="nav-links" aria-label="ERP modules">
                <a href="/dashboard">Dashboard</a>
                <a href="/inventory">Inventory</a>
                <a href="/purchase">Purchase</a>
                <a href="/sales">Sales</a>
            </nav>
        </section>

        <section class="panel">
            <h2>Create Production Order</h2>
            <form id="productionForm">
                <div class="form-grid">
                    <label>Product <select id="productId" required></select></label>
                    <label>Quantity <input id="quantity" type="number" min="0.001" step="0.001" required></label>
                </div>
                <p class="requirements" id="requirements">Select a product and quantity to view BOM requirements.</p>
                <p class="message" id="formMessage" role="alert"></p>
                <button type="submit">Create Production Order</button>
            </form>
        </section>

        <section class="panel table-wrap">
            <div class="toolbar"><h2>Production Orders</h2><strong id="orderCount">0 orders</strong></div>
            <table>
                <thead><tr><th>Order</th><th>Product</th><th>Quantity</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="productionRows"></tbody>
            </table>
            <p class="empty" id="emptyMessage">No production orders found.</p>
        </section>
    </main>

    <script>
        const productSelect = document.getElementById('productId');
        const quantityInput = document.getElementById('quantity');
        const requirements = document.getElementById('requirements');
        const productionRows = document.getElementById('productionRows');
        const formMessage = document.getElementById('formMessage');
        let products = [];
        let boms = [];

        async function requestJson(url, options = {}) {
            const response = await fetch(url, options);
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || 'Production request failed.');
            return result;
        }

        async function loadSetup() {
            const [productResult, bomResult] = await Promise.all([
                requestJson('/api/products'),
                requestJson('/api/boms')
            ]);
            products = productResult.products;
            boms = bomResult.boms;
            productSelect.innerHTML = products.map((product) =>
                `<option value="${product.id}">${product.name} (${product.code})</option>`).join('');
            updateRequirements();
        }

        function updateRequirements() {
            const productId = Number(productSelect.value);
            const quantity = Number(quantityInput.value || 0);
            const productBom = boms.filter((item) => item.product_id === productId);
            requirements.textContent = quantity && productBom.length
                ? productBom.map((item) => `${item.material_name}: ${(Number(item.quantity_per_unit) * quantity).toFixed(3)} ${item.unit}`).join(' | ')
                : 'Select a product and quantity to view BOM requirements.';
        }

        async function renderProduction() {
            try {
                const result = await requestJson('/api/production');
                productionRows.innerHTML = result.orders.map((order) => `
                    <tr><td>${order.order_number}</td><td>${order.product_name}</td><td>${order.quantity}</td>
                    <td class="status ${order.status.toLowerCase().replace(' ', '-')}">${order.status}</td><td>
                    ${order.status === 'Pending' ? `<button type="button" data-start="${order.id}">Start</button>` : ''}
                    ${order.status === 'In Progress' ? `<button type="button" data-complete="${order.id}">Complete</button>` : ''}
                    ${order.status === 'Completed' ? 'Inventory updated' : ''}</td></tr>
                `).join('');
                document.getElementById('orderCount').textContent = `${result.orders.length} order${result.orders.length === 1 ? '' : 's'}`;
                document.getElementById('emptyMessage').hidden = result.orders.length > 0;
            } catch (error) {
                formMessage.textContent = error.message;
            }
        }

        document.getElementById('productionForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            try {
                await requestJson('/api/production', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_id: productSelect.value, quantity: Number(quantityInput.value) })
                });
                this.reset();
                formMessage.textContent = '';
                updateRequirements();
                await renderProduction();
            } catch (error) {
                formMessage.textContent = error.message;
            }
        });

        productionRows.addEventListener('click', async function (event) {
            const startId = event.target.dataset.start;
            const completeId = event.target.dataset.complete;
            if (!startId && !completeId) return;
            try {
                // Completion performs the atomic stock transaction in Flask.
                await requestJson(`/api/production/${startId || completeId}/${startId ? 'start' : 'complete'}`, { method: 'POST' });
                formMessage.textContent = '';
                await renderProduction();
            } catch (error) {
                formMessage.textContent = error.message;
            }
        });

        productSelect.addEventListener('change', updateRequirements);
        quantityInput.addEventListener('input', updateRequirements);
        Promise.all([loadSetup(), renderProduction()]).catch((error) => { formMessage.textContent = error.message; });
    </script>
</body>
</html>
